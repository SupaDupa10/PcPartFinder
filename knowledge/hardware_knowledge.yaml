# ============================================================================
# Hardware-Wissensbasis - aktive Datei
# ============================================================================
#
# Diese Datei enthaelt:
#   1. MODELL-IDENTITAETEN  -> werden zur Hardware-Erkennung benutzt
#      (Kategorie, Modellname, Hersteller, Aliase, Modellnummern, Varianten).
#   2. PREISWISSEN          -> wird zur Bewertung benutzt.
#
# WICHTIG - bitte lesen:
#   * Die Preisfelder sind hier ABSICHTLICH LEER gelassen. Es werden keine
#     Marktpreise erfunden. Trage nur Preise ein, die du aus eigener
#     Marktbeobachtung heraus vertreten kannst.
#   * Diese Werte sind "manuell gepflegtes Preiswissen" und werden in der
#     Oberflaeche immer getrennt von beobachteten Angebotspreisen ausgewiesen.
#   * Beobachtete Angebotspreise aus der Datenbank sind KEINE erzielten
#     Verkaufspreise. Die Anwendung vermischt beides nicht.
#
# Felder pro Eintrag:
#   category            Pflicht. Einer der Schluessel aus backend/categories.py
#   model               Pflicht. Anzeigename des Modells
#   manufacturer        Hersteller
#   product_family      Produktfamilie / Serie (nur Beschriftung)
#   aliases             Weitere Schreibweisen, unter denen das Modell erkannt wird
#   model_numbers       Modellnummern (z. B. Hersteller-/Teilenummern)
#   variants            Ausstattungs-/Groessenvarianten (z. B. "10 GB", "OC")
#
#   good_price_max      Obergrenze fuer einen sehr guten Kaufpreis (EUR)
#   fair_price_max      Obergrenze fuer einen ueblichen Marktpreis (EUR)
#   overpriced_above    Ab diesem Preis gilt es als zu teuer (EUR)
#   performance_index   Optionaler, von DIR gepflegter Leistungsindex.
#                       Keine KI-Schaetzung, keine erfundenen Werte.
#                       Wird fuer das Kriterium "Preis-Leistung" benutzt.
#   known_issues        Bekannte Probleme des Modells
#   risk_flags          Kurze Warnhinweise
#   notes               Freitext-Hinweise
#   problematic         true = Standardfilter kann das Modell ausschliessen
#   exclude             true = Modell wird vom Scoring ausgeschlossen
#   weight              >1.0 = Modell wird bei der Suche bevorzugt
#   source              Herkunft der Daten (Standard: manual_knowledge_base)
#   version             Version des Eintrags (fuer spaetere Nachvollziehbarkeit)
#
# Die Datei kann ohne Codeaenderung erweitert werden. Zusaetzlich koennen
# eigene Dateien in den Einstellungen angegeben werden.
# ============================================================================

version: "2026-10"

# Metadaten zur Nachvollziehbarkeit (rein informativ)
metadata:
  beschreibung: "Starterkatalog mit Modell-Identitaeten. Preisfelder sind bewusst leer."
  preiswissen_vorhanden: false

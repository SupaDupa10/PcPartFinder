[project]
name = "local-ai-hardware-deal-hunter"
version = "0.1.0"
description = "Lokale Desktop-Web-App zur automatischen Suche und Bewertung von Gebraucht-Hardware-Angeboten"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
